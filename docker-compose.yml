# ─────────────────────────────────────────────────────────────────────────────
# Personal Dashboard — monorepo deployment blueprint.
# Deployed from git via Dokploy.
#
# Architecture:
#   - Flat compose (no `include`) — all services in one file.
#   - Remaining services are single-container apps with embedded SQLite:
#
# Conventions (from template-service):
#   • HTTP via Traefik ONLY — no `ports:` on web services.
#   • Raw TCP (PostgreSQL) is the one allowed ports: exception.
#   • Pin image tags — never `:latest`.
#   • Nothing machine-specific in git — domains/secrets from Dokploy env.
#   • Networks: web services on dokploy-network, private deps on internal.
#   • Memory limits on every service — no swap on Pi 5.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Vaultwarden (Passwords) ────────────────────────────────────────────
  vaultwarden:
    image: vaultwarden/server:1.36.0-alpine  # Rust/alpine, single container, embedded SQLite
    restart: unless-stopped

    environment:
      # MUST match the public domain; use https in production or WebAuthn/passkeys
      # and attachment/admin links break.
      DOMAIN: ${VAULTWARDEN_DOMAIN:-http://passwords.example.com}
      # Registration stays open; real protection is Tailscale (no SSO needed).
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      # Argon2 PHC hash — generate with: docker run --rm -it vaultwarden/server /vaultwarden hash
      # Empty disables the /admin panel entirely.
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}

    # SQLite + attachments live here. Named volume so data survives redeploys
    # independently of the Dokploy git-clone dir (db is created automatically).
    volumes:
      - vaultwarden_data:/data

    # For local testing — set VAULTWARDEN_PORT=9100 in .env.
    # Vaultwarden's Rocket server listens on container port 80 by default.
    ports:
      - ${VAULTWARDEN_PORT:-}:80

    # 192M (not 128M): server-side Argon2id verification of ADMIN_TOKEN spikes
    # ~64 MiB transiently on each /admin login — headroom for the no-swap Pi 5.
    deploy:
      resources:
        limits:
          memory: 192M

    networks:
      - internal
      - dokploy-network

  # ── Super Productivity (Pomodoro / Time Tracker) ────────────────────────
  # Local-first web app: state lives in browser localStorage; this container
  # only serves the static Angular app. Multi-device sync goes through the
  # WebDAV container below (SP's built-in WebDAV sync provider).
  superproductivity:
    image: johannesjo/super-productivity:latest  # upstream publishes no version tags
    restart: unless-stopped

    # For local testing — set SUPERPRODUCTIVITY_PORT=8090 in .env.
    # Serves on container port 80.
    ports:
      - ${SUPERPRODUCTIVITY_PORT:-}:80

    labels:
      - traefik.enable=true
      # tasks.priney.com → this container :80 (domain set in Dokploy UI)
      - traefik.http.routers.dashboard-superproductivity.rule=Host(`tasks.priney.com`)
      - traefik.http.routers.dashboard-superproductivity.entrypoints=web
      - traefik.http.routers.dashboard-superproductivity.service=dashboard-superproductivity
      - traefik.http.services.dashboard-superproductivity.loadbalancer.server.port=80

    deploy:
      resources:
        limits:
          memory: 64M

    networks:
      - internal
      - dokploy-network

  # ── WebDAV for Super Productivity sync ──────────────────────────────────
  # rclone serve webdav with basic-auth. SP clients (desktop/web/mobile) point
  # at https://<host>/webdav/ with SUPERPRODUCTIVITY_WEBDAV_USER/PASSWORD.
  superproductivity-webdav:
    image: rclone/rclone:sha-3d7b101  # rclone DH has no version tags; sha-tag = pinned commit (v1.71.x, 2026-09-05)
    restart: unless-stopped
    command: >
      serve webdav /data
      --addr :8080
      --user ${SUPERPRODUCTIVITY_WEBDAV_USER:-sp}
      --pass ${SUPERPRODUCTIVITY_WEBDAV_PASSWORD:-changeme-sp-webdav}

    volumes:
      - superproductivity_webdav:/data

    # For local testing — set SUPERPRODUCTIVITY_WEBDAV_PORT=8091 in .env.
    ports:
      - ${SUPERPRODUCTIVITY_WEBDAV_PORT:-}:8080

    deploy:
      resources:
        limits:
          memory: 64M

    networks:
      - internal
      - dokploy-network

volumes:
  vaultwarden_data:
  superproductivity_webdav:

# Shared networks.
# dokploy-network is created by Dokploy; internal is for db/cache/backend traffic.
networks:
  dokploy-network:
    external: true
  internal:
    name: ${COMPOSE_PROJECT_NAME:-pd}-internal
    internal: true
